<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入驻基地 - 君安医疗科技</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>

<body data-page="bases">
  <div data-site-header></div>
  <main>
    <section class="page-hero">
      <div class="shell">
        <p class="eyebrow">SETTLED BASES</p>
        <h1>入驻基地</h1>
        <p>汇集来自不同产区的中药材基地资料，以真实产地与种植实景呈现产业连接。</p>
      </div>
    </section>
    <section class="section">
      <div class="shell">
        <div class="filter-row">
          <button class="is-active" type="button">全部基地</button>
          <button type="button" disabled>产地溯源</button>
          <button type="button" disabled>道地药材</button>
        </div>
        <div class="base-grid large">
          <a class="base-card has-image shanzha" href="base-detail.html?base=shanzha"
            style="background-image:url('assets/images/shanzha-base.png')">
            <div class="base-card-content">
              <p>产地溯源案例</p>
              <h3>费县山楂种植集群</h3>
              <p class="meta">山东费县</p>
            </div>
          </a>
          <a class="base-card has-image danshen" href="base-detail.html?base=danshen"
            style="background-image:url('assets/images/danshen-base.png')">
            <div class="base-card-content">
              <p>道地药材案例</p>
              <h3>莱芜白花丹参种植基地</h3>
              <p class="meta">山东莱芜</p>
            </div>
          </a>
          <a class="base-card has-image" href="base-detail.html?base=peony"
            style="background-image:url('assets/images/peony-base.jpg')">
            <div class="base-card-content">
              <p>精品药材案例</p>
              <h3>菏泽精品芍药基地</h3>
              <p class="meta">山东菏泽</p>
            </div>
          </a>
          <a class="base-card has-image mudan" href="base-detail.html?base=mudan"
            style="background-image:url('assets/images/mudan-base.jpg')">
            <div class="base-card-content">
              <p>花木产地案例</p>
              <h3>菏泽孔庄牡丹基地</h3>
              <p class="meta">山东菏泽黄堽镇</p>
            </div>
          </a>
          <a class="base-card pending" href="base-detail.html?base=pending">
            <div class="base-card-content">
              <p>COMING SOON</p>
              <h3>更多优质基地<br>持续入驻</h3>
              <p class="meta">资料待补充</p>
            </div>
          </a>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <button class="to-top" type="button" aria-label="回到顶部" data-to-top>↑</button>
</body>

</html>
